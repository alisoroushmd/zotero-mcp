name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,graph,fulltext]"
      - run: python -m pytest tests/ -v

  # Gate the release on (a) the version the tag claims matching both manifests
  # and (b) the built wheel importing cleanly in a fresh venv (ZOT-27).
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Assert tag == pyproject == manifest version
        run: |
          python - <<'PY'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pyproj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("manifest.json"))["version"]
          assert tag == pyproj == manifest, f"version mismatch: tag={tag} pyproject={pyproj} manifest={manifest}"
          print(f"versions in sync: {tag}")
          PY
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import zotero_mcp; print('version', zotero_mcp.__version__)"
          /tmp/clean/bin/python -c "from zotero_mcp.server import mcp; print('server imports OK')"

  publish-pypi:
    needs: [test, release-gate, build-mcpb]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  build-mcpb:
    needs: [test, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g @anthropic-ai/mcpb@2.1.2
      - run: mcpb pack
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb-package
          path: "*.mcpb"

  github-release:
    needs: [publish-pypi, build-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mcpb-package
      - name: Extract changelog entry
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk "/^## \[?${version}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: "*.mcpb"
