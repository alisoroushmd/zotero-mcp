name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      # Ensure the committed uv.lock stays consistent with pyproject (ZOT-27):
      # a stale lock gives a false impression of reproducibility.
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,graph,fulltext]"
      - run: python -m pytest tests/ -v

  # Build the real wheel and install it into a clean venv with NO extras, then
  # import the server and run it with --help-style smoke checks (ZOT-27). This
  # is the artifact end users actually receive via `uvx`/`pip` — the editable
  # `test` job above never exercises it, so dependency-resolution drift (e.g. an
  # untested fastmcp major) and missing runtime deps would otherwise slip
  # through to release.
  smoke-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install built wheel in a clean venv (base deps only)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Smoke-test the base install (no graph/fulltext extras)
        run: |
          /tmp/clean/bin/python -c "import zotero_mcp; print('version', zotero_mcp.__version__)"
          /tmp/clean/bin/python -c "from zotero_mcp.server import mcp; print('server imports OK')"
          # The graph tool must degrade with a clear ImportError, not crash on import.
          /tmp/clean/bin/python -c "import zotero_mcp.knowledge_graph as k; assert not k.HAS_NETWORKX, 'networkx unexpectedly present in base install'"
      - name: Smoke-test the full install (with extras)
        run: |
          /tmp/clean/bin/pip install "dist/"*.whl --force-reinstall
          /tmp/clean/bin/pip install networkx numpy scipy pypdf
          /tmp/clean/bin/python -c "from zotero_mcp.knowledge_graph import KnowledgeGraph; KnowledgeGraph(); print('graph extra OK')"

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert pyproject and manifest versions match (ZOT-27)
        run: |
          python - <<'PY'
          import json, tomllib
          pyproj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("manifest.json"))["version"]
          assert pyproj == manifest, f"version drift: pyproject {pyproj} != manifest {manifest}"
          print(f"versions in sync: {pyproj}")
          PY
